<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>尤美农场 · 场景原型</title>
  <style>
    :root {
      --ink: #493725;
      --border: #8b704e;
      --paper: #f8efd4;
    }

    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; }
    body {
      min-width: 800px;
      min-height: 600px;
      color: var(--ink);
      font-family: "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
      background: #ead8a9;
    }
    .app {
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100vh;
      min-height: 600px;
      overflow: hidden;
      border: 1px solid #604a30;
    }
    .topbar {
      z-index: 3;
      flex: none;
      height: 78px;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 22px;
      background: #f7efd5;
      border-bottom: 3px solid #ae9469;
      box-shadow: 0 3px 0 #d3bb83;
    }
    .ui-button {
      min-height: 40px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 6px 12px;
      border: 2px solid var(--border);
      border-radius: 7px;
      background: #fff9e9;
      color: var(--ink);
      font-size: 16px;
      white-space: nowrap;
    }
    .title { min-width: 152px; display: flex; flex-direction: column; line-height: 1.2; }
    .title strong { font-size: 24px; letter-spacing: .02em; }
    .title small { font-size: 12px; }
    .xp-icon { width: 23px; height: 23px; image-rendering: pixelated; }
    .xp-track { width: 165px; height: 13px; border: 1px solid #8d7853; border-radius: 20px; background: #d6c7a3; overflow: hidden; }
    .xp-track i { display: block; width: 42%; height: 100%; background: #8cad55; }
    .top-spacer { flex: 1; }
    .top-icon { width: 23px; height: 23px; object-fit: contain; image-rendering: pixelated; }
    .close { width: 46px; font-size: 26px; }

    .layout { display: grid; grid-template-columns: minmax(0, 1fr) 320px; flex: 1; min-height: 0; }
    .field {
      position: relative;
      min-width: 0;
      overflow: hidden;
      background: #9cb974 url('prototype-assets/meadow-scene.png') center center / 100% 100% no-repeat;
      isolation: isolate;
    }
    .field::after {
      content: "";
      position: absolute;
      inset: 20% 0 0;
      z-index: -1;
      background: rgba(125, 153, 93, .075);
      pointer-events: none;
    }
    .greeting {
      position: absolute;
      z-index: 2;
      left: 24px;
      top: 18px;
      margin: 0;
      color: #456d64;
      font-size: 16px;
      text-shadow: 1px 1px rgba(252, 251, 225, .85);
    }
    .ground-shadow {
      position: absolute;
      border-radius: 50%;
      background: rgba(51, 88, 49, .3);
      filter: blur(3px);
    }
    .farmhouse {
      position: absolute;
      z-index: 1;
      left: 3%;
      top: 21%;
      width: clamp(120px, 19%, 230px);
      height: auto;
      image-rendering: pixelated;
      filter: drop-shadow(3px 5px 0 rgba(63, 79, 39, .25));
    }
    .house-shadow { left: 4%; top: 41%; width: 17%; height: 2.5%; }
    .fruit-tree {
      position: absolute;
      z-index: 1;
      right: 3.8%;
      top: 18.5%;
      width: clamp(80px, 12%, 126px);
      height: auto;
      image-rendering: pixelated;
      filter: drop-shadow(3px 5px 0 rgba(63, 79, 39, .24));
    }
    .tree-shadow { right: 5%; top: 40%; width: 9%; height: 2.5%; }

    .plots {
      position: absolute;
      z-index: 2;
      left: 24%;
      top: 29%;
      width: 60%;
      aspect-ratio: 1.65;
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      grid-template-rows: repeat(3, minmax(0, 1fr));
      column-gap: 4px;
      row-gap: 4px;
    }
    .plot {
      position: relative;
      min-width: 0;
      min-height: 0;
      border-radius: 14px;
      background: url('prototype-assets/soil-bed.png') center / 106% 116% no-repeat;
      image-rendering: pixelated;
    }
    .plot.locked {
      background-image: url('prototype-assets/grass-bed.png');
      background-size: 108% 120%;
    }
    .plot.locked .plot-label { background: rgba(49, 91, 52, .82); }
    .crop {
      position: absolute;
      left: 20%;
      top: 10%;
      width: 60%;
      height: 67%;
      background-image: var(--crop);
      background-position: var(--stage) center;
      background-size: 400% 100%;
      background-repeat: no-repeat;
      image-rendering: pixelated;
      filter: drop-shadow(1px 2px 1px rgba(40, 31, 12, .3));
    }
    .plot-label {
      position: absolute;
      left: 50%;
      bottom: 8%;
      max-width: 86%;
      padding: 2px 6px;
      transform: translateX(-50%);
      border-radius: 4px;
      color: #fff4d4;
      background: rgba(68, 39, 23, .82);
      font-size: 11px;
      font-weight: 700;
      line-height: 1.15;
      white-space: nowrap;
      text-shadow: 1px 1px #382313;
    }
    .empty-glyph, .lock-glyph {
      position: absolute;
      left: 50%;
      top: 42%;
      transform: translate(-50%, -50%);
      color: #fff4c7;
      font-size: 27px;
      font-weight: 700;
      text-shadow: 2px 2px #6f482b;
    }
    .lock-glyph { font-size: 22px; }
    .ready {
      position: absolute;
      z-index: 1;
      top: 2px;
      right: 3px;
      width: 21px;
      height: 21px;
      image-rendering: pixelated;
    }
    .companion {
      position: absolute;
      z-index: 3;
      left: 4.5%;
      bottom: 6%;
      width: 96px;
      height: 143px;
      background: url('../../src/renderer/assets/farm/youmei-sample.png') left center / 200% 100% no-repeat;
      image-rendering: pixelated;
      filter: drop-shadow(3px 5px 0 rgba(42, 67, 36, .28));
    }
    .barrel {
      position: absolute;
      z-index: 2;
      left: 16%;
      bottom: 8%;
      width: 58px;
      height: 65px;
      object-fit: contain;
      image-rendering: pixelated;
      filter: drop-shadow(2px 4px 0 rgba(42, 67, 36, .26));
    }
    .field-note {
      position: absolute;
      z-index: 1;
      right: 3.5%;
      bottom: 5.5%;
      padding: 4px 8px;
      border-radius: 4px;
      background: rgba(244, 238, 207, .7);
      color: #536747;
      font-size: 11px;
      letter-spacing: .1em;
    }

    .sidebar {
      min-height: 0;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      background: #f3e7c9;
      border-left: 3px solid #ae9469;
    }
    .side-tabs { flex: none; display: flex; gap: 8px; padding: 12px 12px 8px; }
    .side-tabs .ui-button { flex: 1; font-size: 16px; }
    .side-tabs .active { background: #d1dfad; }
    .order-list { overflow: hidden; padding: 2px 12px 14px; }
    .order {
      min-height: 84px;
      margin: 8px 0 10px;
      padding: 13px;
      border: 2px solid #c3aa7d;
      border-radius: 6px;
      background: #fff9ea;
    }
    .order strong { display: block; margin-bottom: 7px; font-size: 17px; }
    .order p { margin: 4px 0; font-size: 13px; }
    .reward { margin: 10px 0 !important; }
    .order-actions { display: flex; gap: 6px; margin-top: 9px; }
    .order-actions span { padding: 5px 8px; border: 1px solid #927955; border-radius: 5px; background: #fffaf0; font-size: 12px; }
    .order-actions .disabled { opacity: .42; }

    .toolbar {
      z-index: 3;
      flex: none;
      height: 94px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      padding: 8px 12px;
      background: #ead8ad;
      border-top: 3px solid #ad9367;
    }
    .tool {
      width: 90px;
      height: 73px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 2px;
      border: 2px solid var(--border);
      border-radius: 6px;
      background: #fff8e5;
      font-size: 14px;
      white-space: nowrap;
    }
    .tool img { width: 29px; height: 29px; object-fit: contain; image-rendering: pixelated; }
    @media (max-width: 1000px) {
      .layout { grid-template-columns: minmax(0, 1fr) 240px; }
      .topbar { gap: 8px; padding: 8px 12px; }
      .title { min-width: 126px; }
      .title strong { font-size: 20px; }
      .xp-track { width: 95px; }
      .farmhouse { left: 2%; top: 23%; width: clamp(115px, 21%, 165px); }
      .house-shadow { left: 3%; top: 41%; width: 18%; }
      .fruit-tree { right: 2.5%; width: 10.5%; }
      .plots { left: 25%; width: 62%; top: 29%; }
      .plot-label { font-size: 9px; padding: 1px 3px; }
      .companion { transform: scale(.78); transform-origin: bottom left; }
      .barrel { left: 16%; width: 42px; }
      .toolbar { gap: 5px; }
      .tool { width: 70px; font-size: 11px; }
    }
    @media (max-height: 690px) {
      .topbar { height: 64px; }
      .toolbar { height: 78px; }
      .tool { height: 62px; }
      .tool img { width: 24px; height: 24px; }
      .companion { transform: scale(.7); transform-origin: bottom left; }
      .plot-label { font-size: 9px; }
      .order { padding: 8px 10px; margin: 6px 0; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <span class="ui-button">← 返回</span>
      <div class="title"><strong>尤美农场</strong><small>Lv.1</small></div>
      <img class="xp-icon" src="../../src/renderer/assets/farm/icon-experience.png" alt="" />
      <div class="xp-track"><i></i></div>
      <div class="top-spacer"></div>
      <span class="ui-button">◈ 629</span>
      <span class="ui-button"><img class="top-icon" src="../../src/renderer/assets/farm/icon-warehouse.png" alt="" />仓库</span>
      <span class="ui-button close">×</span>
    </header>

    <div class="layout">
      <main class="field" aria-label="农场静态场景原型">
        <p class="greeting">一片安静的田地，等你来照料。</p>
        <div class="ground-shadow house-shadow"></div>
        <img class="farmhouse" src="prototype-assets/farmhouse.png" alt="农舍" />
        <div class="ground-shadow tree-shadow"></div>
        <img class="fruit-tree" src="../../src/renderer/assets/farm/tree.png" alt="果树" />

        <div class="plots" role="group" aria-label="十二块农田">
          <div class="plot"><div class="crop" style="--crop: url('../../src/renderer/assets/farm/wheat-stages.png'); --stage: 33.333%"></div><span class="plot-label">小麦 · 幼苗</span></div>
          <div class="plot"><div class="crop" style="--crop: url('../../src/renderer/assets/farm/carrot-stages.png'); --stage: 33.333%"></div><span class="plot-label">胡萝卜 · 幼苗</span></div>
          <div class="plot"><div class="crop" style="--crop: url('../../src/renderer/assets/farm/carrot-stages.png'); --stage: 33.333%"></div><span class="plot-label">胡萝卜 · 幼苗</span></div>
          <div class="plot"><div class="crop" style="--crop: url('../../src/renderer/assets/farm/carrot-stages.png'); --stage: 33.333%"></div><span class="plot-label">胡萝卜 · 幼苗</span></div>
          <div class="plot"><div class="crop" style="--crop: url('../../src/renderer/assets/farm/wheat-stages.png'); --stage: 33.333%"></div><span class="plot-label">小麦 · 幼苗</span></div>
          <div class="plot"><span class="empty-glyph">＋</span><span class="plot-label">空地</span></div>
          <div class="plot locked"><span class="lock-glyph">▣</span><span class="plot-label">Lv.3</span></div>
          <div class="plot locked"><span class="lock-glyph">▣</span><span class="plot-label">Lv.3</span></div>
          <div class="plot locked"><span class="lock-glyph">▣</span><span class="plot-label">Lv.3</span></div>
          <div class="plot locked"><span class="lock-glyph">▣</span><span class="plot-label">Lv.5</span></div>
          <div class="plot locked"><span class="lock-glyph">▣</span><span class="plot-label">Lv.5</span></div>
          <div class="plot locked"><span class="lock-glyph">▣</span><span class="plot-label">Lv.5</span></div>
        </div>

        <div class="companion" aria-label="尤美"></div>
        <img class="barrel" src="../../src/renderer/assets/farm/barrel.png" alt="木桶" />
        <span class="field-note">场景视觉原型</span>
      </main>

      <aside class="sidebar">
        <div class="side-tabs"><span class="ui-button active">农场订单</span><span class="ui-button">地块详情</span></div>
        <div class="order-list">
          <div class="order"><strong>补单中</strong><p>29 分钟</p></div>
          <div class="order"><strong>订单 2</strong><p>胡萝卜 0/3</p><p class="reward">◈ 23 · +15 EXP</p><div class="order-actions"><span class="disabled">交付</span><span>放弃</span></div></div>
          <div class="order"><strong>订单 3</strong><p>小麦 0/3</p><p>胡萝卜 0/3</p><p class="reward">◈ 30 · +30 EXP</p><div class="order-actions"><span class="disabled">交付</span><span>放弃</span></div></div>
        </div>
      </aside>
    </div>

    <footer class="toolbar">
      <div class="tool"><img src="../../src/renderer/assets/farm/icon-seeds.png" alt="" />种子</div>
      <div class="tool"><img src="../../src/renderer/assets/farm/icon-water.png" alt="" />浇水</div>
      <div class="tool"><img src="../../src/renderer/assets/farm/icon-harvest.png" alt="" />收获</div>
      <div class="tool"><img src="../../src/renderer/assets/farm/icon-orders.png" alt="" />农场订单</div>
      <div class="tool"><img src="../../src/renderer/assets/farm/icon-shop.png" alt="" />商店</div>
      <div class="tool"><img src="../../src/renderer/assets/farm/icon-decorate.png" alt="" />布置</div>
      <div class="tool"><img src="../../src/renderer/assets/farm/icon-codex.png" alt="" />图鉴</div>
      <div class="tool"><img src="../../src/renderer/assets/farm/icon-backup.png" alt="" />备份与恢复</div>
    </footer>
  </div>
</body>
</html>
